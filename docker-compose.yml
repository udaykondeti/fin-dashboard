# Production compose for EC2.
# Pulls the image GitHub Actions pushes to GHCR on every merge to main.
# Mounts /var/www/fin-dashboard/{data,.env} from the host so the DB and
# secrets survive container replacement.

services:
  fin-dashboard:
    image: ghcr.io/udaykondeti/fin-dashboard:latest
    container_name: fin-dashboard
    restart: unless-stopped
    pull_policy: always
    # Bind to localhost only — nginx on the host reverse-proxies 443 → 3001
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - /var/www/fin-dashboard/.env
    volumes:
      # SQLite file persists here across `docker compose up` cycles
      - /var/www/fin-dashboard/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
