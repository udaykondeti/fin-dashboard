name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ "$EC2_USER@$EC2_HOST:/var/www/fin-dashboard/"

      - name: Install deps and restart app
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "cd /var/www/fin-dashboard && npm install --production --silent && pm2 restart fin-dashboard && pm2 save"

      - name: Sync nginx config and reload
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "set -e; \
             sudo cp /var/www/fin-dashboard/nginx/fin.kirakon.com.conf /etc/nginx/sites-available/fin.kirakon.com.conf && \
             sudo ln -sf /etc/nginx/sites-available/fin.kirakon.com.conf /etc/nginx/sites-enabled/fin.kirakon.com.conf && \
             sudo nginx -t && \
             sudo systemctl reload nginx"

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "curl -fsS http://localhost:3001/api/health"
