name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-injected; needs `packages: write` permission above
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Use lowercase repo name (GHCR rejects uppercase). github.repository
          # is e.g. "udaykondeti/fin-dashboard" → ghcr.io/udaykondeti/fin-dashboard
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          # Only need the compose file + nginx config for the EC2 sync
          sparse-checkout: |
            docker-compose.yml
            nginx
            scripts

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync compose + nginx to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Only ship the files EC2 needs — image carries the app code now.
          rsync -avz \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            docker-compose.yml nginx scripts \
            "$EC2_USER@$EC2_HOST:/var/www/fin-dashboard/"

      - name: Pull image, restart container, retire PM2 process
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" << EOF
            set -e
            cd /var/www/fin-dashboard

            # Authenticate to GHCR (idempotent; refreshes token each deploy)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull latest image + restart container
            docker compose pull
            docker compose up -d --remove-orphans

            # Retire the legacy PM2 process if still around — Docker is the
            # supervisor now. \`|| true\` so first-time runs don't fail.
            pm2 stop fin-dashboard 2>/dev/null || true
            pm2 delete fin-dashboard 2>/dev/null || true
            pm2 save 2>/dev/null || true
          EOF

      - name: Sync nginx config + reload
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            sudo cp /var/www/fin-dashboard/nginx/fin.kirakon.com.conf /etc/nginx/sites-available/fin.kirakon.com.conf
            sudo ln -sf /etc/nginx/sites-available/fin.kirakon.com.conf /etc/nginx/sites-enabled/fin.kirakon.com.conf
            sudo nginx -t
            sudo systemctl reload nginx
          EOF

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Give the container a moment to come up + healthcheck pass
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sleep 8 && curl -fsS http://localhost:3001/api/health"
