name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-injected; needs `packages: write` permission above
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Use lowercase repo name (GHCR rejects uppercase). github.repository
          # is e.g. "udaykondeti/fin-dashboard" → ghcr.io/udaykondeti/fin-dashboard
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 for the EC2 box, arm64 for the Apple-Silicon Mac Mini.
          platforms: linux/amd64,linux/arm64

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          # Only ship the compose file the Mac Mini needs — image carries app code.
          sparse-checkout: |
            docker-compose.mac.yml
            scripts

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Mac Mini SSH on default port 22, reachable via Tailscale tailnet.
          # (EC2_HOST should be the Mac's MagicDNS short name, e.g. "udays-mac-mini",
          # so the connection goes over the tailnet rather than Cloudflare.)
          # IdentitiesOnly=yes prevents ssh from offering every key the runner's
          # ssh-agent knows about — without it macOS sshd hits MaxAuthTries and
          # bails with "Too many authentication failures" before our key is tried.
          printf 'Host %s\n  Port 22\n  StrictHostKeyChecking accept-new\n  IdentityFile ~/.ssh/id_rsa\n  IdentitiesOnly yes\n  PreferredAuthentications publickey\n' "$EC2_HOST" >> ~/.ssh/config

      - name: Sync compose file to Mac Mini
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            docker-compose.mac.yml scripts \
            "$EC2_USER@$EC2_HOST:~/fin-dashboard/"

      - name: Pull image & restart container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" << EOF
            set -e
            cd ~/fin-dashboard

            # Authenticate to GHCR by writing the auth directly into
            # ~/.docker/config.json. We can't use \`docker login\` here: the
            # macOS CLI defaults to the osxkeychain credential helper, which
            # fails over SSH with "User interaction is not allowed. (-25308)"
            # because there's no GUI session to unlock the keychain.
            mkdir -p ~/.docker
            AUTH=\$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64)
            printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "\$AUTH" > ~/.docker/config.json
            chmod 600 ~/.docker/config.json

            # Pull latest image + restart — Mac Mini uses docker-compose.mac.yml
            docker compose -f docker-compose.mac.yml pull
            docker compose -f docker-compose.mac.yml up -d --remove-orphans
          EOF

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Give the container a moment to come up + healthcheck pass
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            "sleep 8 && curl -fsS http://localhost:3001/api/health"
