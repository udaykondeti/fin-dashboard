# Rate-limit zone for sensitive auth endpoints. 10 req/s per client IP, with
# a small burst. Defined at http{} level via include — placed here to keep
# config self-contained; if main nginx.conf already defines `auth_limit`,
# remove this line.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

# Gzip compression — compresses HTML, JS, JSON, CSS, and SVG before sending.
# Chart.js (~220 KB) compresses to ~70 KB; index.html (~2,800 lines) also
# benefits significantly. Only applies to responses >= 1 KB to avoid wasting
# CPU on tiny payloads.
gzip on;
gzip_types text/html text/css text/plain application/javascript application/json application/xml image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;

server {
    listen 80;
    server_name fin.kirakon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fin.kirakon.com;

    ssl_certificate /etc/letsencrypt/live/fin.kirakon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fin.kirakon.com/privkey.pem;

    # Security headers. X-XSS-Protection is deprecated and was removed; modern
    # browsers ignore it and a misconfigured value can introduce vulnerabilities.
    # Express also sets a permissive default CSP via helmet (disabled in code
    # because the SPA uses inline scripts) — set a tighter one here once the
    # frontend is modularised.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Rate-limit auth endpoints (login, change-password) at the edge as a
    # second layer in front of the in-app express-rate-limit.
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoints — disable proxy buffering so token deltas reach the
    # browser as the upstream emits them, and bump read timeout so a
    # tool-using LLM call (which can take >60s) doesn't get cut off.
    location ~ ^/api/chat/threads/[^/]+/stream$ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
