# Mac Mini — kirakon.com apps (EC2 migration)
#
# cloudflared runs on the Kirakon server and routes to these containers
# via the Mac Mini's Tailscale IP (100.85.165.105). No cloudflared needed here.
#
# Cloudflare Tunnel routes (kirakon tunnel → Mac Mini):
#   coffee.kirakon.com     → http://100.85.165.105:3003  (cafe-dashboard)
#   fin.kirakon.com        → http://100.85.165.105:3001  (fin-dashboard)
#   timesheet.kirakon.com  → http://100.85.165.105:3000  (timesheet)
#   admin.kirakon.com      → http://100.85.165.105:3002  (timesheet admin panel)
#   git.kirakon.com        → http://100.85.165.105:3005  (pippy)
#   ai.kirakon.com         → http://100.85.165.105:3004  (open-webui → Ollama)
#
# Required env files on Mac Mini (~/kirakon/):
#   fin-dashboard/.env   — copy from EC2 /var/www/fin-dashboard/.env
#   timesheet/.env       — copy from EC2 /home/ubuntu/timesheet-pro/.env
#   pippy/.env           — copy from EC2 /home/ubuntu/pippy/.env
#
# First-time setup on Mac Mini:
#   mkdir -p ~/kirakon/{fin-dashboard,timesheet,pippy,cafe-dashboard,open-webui}/data
#   scp ubuntu@34.195.147.243:/home/ubuntu/timesheet-pro/.env ~/kirakon/timesheet/.env
#   scp ubuntu@34.195.147.243:/home/ubuntu/pippy/.env ~/kirakon/pippy/.env
#   scp ubuntu@34.195.147.243:/var/www/fin-dashboard/.env ~/kirakon/fin-dashboard/.env
#   docker compose -f docker-compose.mac.yml up -d

networks:
  kirakon:
    name: kirakon

services:

  # ── Fin Dashboard (fin.kirakon.com) ───────────────────────────────────────
  fin-dashboard:
    image: ghcr.io/udaykondeti/fin-dashboard:latest
    container_name: fin-dashboard
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3001:3001"   # bound to localhost; Tailscale reaches it via host IP
    env_file: ~/kirakon/fin-dashboard/.env
    environment:
      # Route agent calls through the shared kirakon gateway (Open WebUI in
      # the same compose network) so they're authenticated, logged, and
      # subject to per-app rate-limits. Direct host Ollama bypass is at
      # http://host.docker.internal:11434/v1 if needed for debugging.
      # OLLAMA_API_KEY must come from ~/kirakon/fin-dashboard/.env on the
      # Mac Mini — generate one in Open WebUI → Settings → Account → API keys.
      OLLAMA_BASE_URL: "http://open-webui:8080/ollama/v1"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-mistral}"
      VAULT_PATH: "/app/vault"
    volumes:
      - ~/kirakon/fin-dashboard/data:/app/data
      - ~/kirakon/fin-dashboard/vault:/app/vault
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Timesheet (timesheet.kirakon.com) ─────────────────────────────────────
  timesheet:
    image: ghcr.io/udaykondeti/timesheet:latest
    container_name: timesheet
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ~/kirakon/timesheet/.env
    volumes:
      - ~/kirakon/timesheet/data:/app/data
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Timesheet Agent (sidecar — internal only) ─────────────────────────────
  timesheet-agent:
    image: ghcr.io/udaykondeti/timesheet:latest
    container_name: timesheet-agent
    restart: unless-stopped
    pull_policy: always
    command: ["node", "local-agent/index.js"]
    env_file: ~/kirakon/timesheet/.env
    networks: [kirakon]
    depends_on: [timesheet]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Pippy / git.kirakon.com ───────────────────────────────────────────────
  pippy:
    image: ghcr.io/udaykondeti/pippy:latest
    container_name: pippy
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3005:3005"
    env_file: ~/kirakon/pippy/.env
    volumes:
      - ~/kirakon/pippy/data:/app/data
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3005/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Cafe Dashboard / coffee.kirakon.com ───────────────────────────────────
  cafe-dashboard:
    image: ghcr.io/udaykondeti/cafe-dashboard:latest
    container_name: cafe-dashboard
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3003:3003"   # update inner port if app listens on different port
    volumes:
      - ~/kirakon/cafe-dashboard/data:/app/data
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Open WebUI / ai.kirakon.com (Ollama frontend) ────────────────────────
  # Ollama runs natively on the Mac Mini host (not in Docker).
  # Open WebUI connects to it via host.docker.internal:11434.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3004:8080"   # Open WebUI listens on 8080 internally
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_AUTH: "true"        # set false to disable login (Tailscale-only access)
    volumes:
      - ~/kirakon/open-webui/data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
