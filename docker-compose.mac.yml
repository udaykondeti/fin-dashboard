# Mac Mini — kirakon.com apps
#
# All apps run here on the Mac Mini (Tailscale IP: 100.85.165.105).
# Kirakon Linux server (100.111.42.94) is the AI-only gateway — no apps.
#
# Cloudflare Tunnel routes:
#   coffee.kirakon.com     → http://100.85.165.105:3003  (cafe-dashboard)
#   fin.kirakon.com        → http://100.85.165.105:3001  (fin-dashboard)
#   timesheet.kirakon.com  → http://100.85.165.105:3000  (timesheet)
#   admin.kirakon.com      → http://100.85.165.105:3002  (timesheet admin panel)
#   git.kirakon.com        → http://100.85.165.105:3005  (pippy)
#   ai.kirakon.com         → https://ai.kirakon.com      (LiteLLM AI gateway on Kirakon)
#
# AI gateway (LiteLLM) on Kirakon: https://ai.kirakon.com/v1
#   All app AI calls go here. Set OLLAMA_API_KEY=<LITELLM_MASTER_KEY> in
#   each app's .env on the Mac Mini (~/kirakon/<app>/.env).
#
# Required env files on Mac Mini (~/kirakon/):
#   fin-dashboard/.env   — must include OLLAMA_API_KEY
#   timesheet/.env       — must include OLLAMA_API_KEY
#   pippy/.env
#
# First-time setup:
#   mkdir -p ~/kirakon/{fin-dashboard,timesheet,pippy,cafe-dashboard,open-webui}/data
#   docker compose -f docker-compose.mac.yml up -d

networks:
  kirakon:
    name: kirakon

services:

  # ── Fin Dashboard (fin.kirakon.com) ─────────────────────────────────────────
  fin-dashboard:
    image: ghcr.io/udaykondeti/fin-dashboard:latest
    container_name: fin-dashboard
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file: ~/kirakon/fin-dashboard/.env
    environment:
      OLLAMA_BASE_URL: "https://ai.kirakon.com/v1"
      OLLAMA_MODEL: "agent"
      VAULT_PATH: "/app/vault"
    volumes:
      - ~/kirakon/fin-dashboard/data:/app/data
      - ~/kirakon/fin-dashboard/vault:/app/vault
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Timesheet (timesheet.kirakon.com) ────────────────────────────────────
  timesheet:
    image: ghcr.io/udaykondeti/timesheet:latest
    container_name: timesheet
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ~/kirakon/timesheet/.env
    volumes:
      - ~/kirakon/timesheet/data:/app/data
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Timesheet Agent (sidecar — AI calls only, internal) ──────────────────
  timesheet-agent:
    image: ghcr.io/udaykondeti/timesheet:latest
    container_name: timesheet-agent
    restart: unless-stopped
    pull_policy: always
    command: ["node", "local-agent/index.js"]
    env_file: ~/kirakon/timesheet/.env
    environment:
      OLLAMA_BASE_URL: "https://ai.kirakon.com/v1"
      OLLAMA_MODEL: "agent"
    networks: [kirakon]
    depends_on: [timesheet]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Pippy / git.kirakon.com ───────────────────────────────────────────────
  pippy:
    image: ghcr.io/udaykondeti/pippy:latest
    container_name: pippy
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3005:3005"
    env_file: ~/kirakon/pippy/.env
    volumes:
      - ~/kirakon/pippy/data:/app/data
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3005/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Cafe Dashboard / coffee.kirakon.com ───────────────────────────────────
  cafe-dashboard:
    image: ghcr.io/udaykondeti/cafe-dashboard:latest
    container_name: cafe-dashboard
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ~/kirakon/cafe-dashboard/data:/app/data
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Open WebUI (human chat UI only) ─────────────────────────────────────
  # UI for humans to chat with Ollama models. Apps do NOT route through here
  # — they go directly to https://ai.kirakon.com/v1 (Kirakon LiteLLM).
  # Connects to Mac Mini's native Ollama on the host (host.docker.internal:11434).
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3004:8080"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_AUTH: "true"
    volumes:
      - ~/kirakon/open-webui/data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [kirakon]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
