# Production compose for the Mac Mini (Apple Silicon).
#
# Differences from docker-compose.yml (EC2):
#   - adds a cloudflared sidecar so the dashboard is reachable at
#     https://fin.kirakon.com without port-forwarding or a public IP
#   - the app talks to Ollama running natively on the Mac host via
#     host.docker.internal (Docker Desktop provides this automatically)
#
# Paths assume the repo / data live under ~/fin-dashboard on the Mac.
# Override with: APP_DIR=/some/path docker compose -f docker-compose.mac.yml up -d
#
# Required host-side files:
#   ${APP_DIR}/.env               — app secrets + OLLAMA_BASE_URL
#   ${APP_DIR}/data/              — SQLite volume
#   ${APP_DIR}/cloudflared.env    — contains TUNNEL_TOKEN=...

services:
  fin-dashboard:
    image: ghcr.io/udaykondeti/fin-dashboard:latest
    container_name: fin-dashboard
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ${APP_DIR:-./}/.env
    environment:
      # Ollama runs natively on the Mac host, not in a container.
      # host.docker.internal resolves to the host on Docker Desktop.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434/v1"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
    volumes:
      - ${APP_DIR:-./}/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Cloudflare Tunnel — outbound-only connection to Cloudflare's edge.
  # No inbound ports opened on the home router. Create the tunnel + token
  # in the Cloudflare Zero Trust dashboard, then put TUNNEL_TOKEN in
  # ${APP_DIR}/cloudflared.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fin-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ${APP_DIR:-./}/cloudflared.env
    depends_on:
      - fin-dashboard
